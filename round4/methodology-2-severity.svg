<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img"
     aria-label="How a fired check becomes a computed severity, and a severity becomes a prioritised action">
  <title>Severity is computed, not chosen — and the action follows the mechanism</title>
  <desc>A check fires from evidence in the shared bundle. Its base severity comes
  from the registry rule, is modified by scope and confidence, passes six
  false-positive gates, and is demoted if a root cause supersedes it. Two clamps
  can stop movement: a locked registry guard, and the rule that a model-judged
  finding may never be critical without deterministic corroboration. Defects
  become findings with a fix; measured-but-instance-dependent signals become
  recommendations. Both are ranked by impact over effort.</desc>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#ffffff"/>

  <text x="40" y="52" font-family="sans-serif" font-size="31" font-weight="700" fill="#1a1a1a">
    Severity is computed, not chosen — and the action follows the mechanism
  </text>
  <text x="40" y="84" font-family="sans-serif" font-size="18" fill="#5a5a5a">
    Same bundle in, same findings and same IDs out, every run. The arithmetic lives in audit-orchestrator/scripts/merge_findings.py.
  </text>

  <!-- chain -->
  <rect x="40" y="170" width="220" height="140" rx="10" fill="#f4f6f8" stroke="#c8c8c8"/>
  <text x="150" y="206" font-family="sans-serif" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="middle">Check fires</text>
  <text x="150" y="234" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">evidence read from</text>
  <text x="150" y="255" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">the one shared bundle</text>
  <text x="150" y="288" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f6feb" text-anchor="middle">scripts/check_*.py</text>

  <rect x="300" y="170" width="220" height="140" rx="10" fill="#f4f6f8" stroke="#c8c8c8"/>
  <text x="410" y="206" font-family="sans-serif" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="middle">Base severity</text>
  <text x="410" y="234" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">the check's own</text>
  <text x="410" y="255" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">severity_rule</text>
  <text x="410" y="288" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f6feb" text-anchor="middle">references/checks.yaml</text>

  <rect x="560" y="170" width="220" height="140" rx="10" fill="#f4f6f8" stroke="#c8c8c8"/>
  <text x="670" y="206" font-family="sans-serif" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="middle">Modifiers</text>
  <text x="670" y="234" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">site-wide escalates,</text>
  <text x="670" y="255" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">low confidence demotes</text>
  <text x="670" y="288" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f6feb" text-anchor="middle">severity-rubric.md</text>

  <rect x="820" y="170" width="220" height="140" rx="10" fill="#f4f6f8" stroke="#c8c8c8"/>
  <text x="930" y="206" font-family="sans-serif" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="middle">Six FP gates</text>
  <text x="930" y="234" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">applicability · evidence</text>
  <text x="930" y="255" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">· guards · sample · intent</text>
  <text x="930" y="288" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f6feb" text-anchor="middle">false-positive-gates.md</text>

  <rect x="1080" y="170" width="220" height="140" rx="10" fill="#f4f6f8" stroke="#c8c8c8"/>
  <text x="1190" y="206" font-family="sans-serif" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="middle">Supersession</text>
  <text x="1190" y="234" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">root cause outranks</text>
  <text x="1190" y="255" font-family="sans-serif" font-size="15" fill="#5a5a5a" text-anchor="middle">its own symptoms</text>
  <text x="1190" y="288" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f6feb" text-anchor="middle">subskills.json</text>

  <rect x="1340" y="170" width="220" height="140" rx="10" fill="#1f6feb" stroke="#1f6feb"/>
  <text x="1450" y="212" font-family="sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">SEVERITY</text>
  <text x="1450" y="244" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">critical · high</text>
  <text x="1450" y="266" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">medium · low</text>
  <text x="1450" y="292" font-family="sans-serif" font-size="14" fill="#cfe0fb" text-anchor="middle">computed, never chosen</text>

  <line x1="260" y1="240" x2="298" y2="240" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="520" y1="240" x2="558" y2="240" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="780" y1="240" x2="818" y2="240" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="1040" y1="240" x2="1078" y2="240" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="1300" y1="240" x2="1338" y2="240" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a2)"/>

  <!-- clamps -->
  <rect x="520" y="360" width="450" height="98" rx="10" fill="#fdf3f3" stroke="#b32d2e" stroke-width="2"/>
  <text x="544" y="390" font-family="sans-serif" font-size="18" font-weight="700" fill="#b32d2e">severity_locked — movement forbidden</text>
  <text x="544" y="416" font-family="sans-serif" font-size="15" fill="#1a1a1a">REACH-003 stays low however wide its scope.</text>
  <text x="544" y="438" font-family="sans-serif" font-size="15" fill="#1a1a1a">REACH-015 never above medium from timing alone.</text>
  <line x1="670" y1="358" x2="670" y2="312" stroke="#b32d2e" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="930" y1="358" x2="930" y2="312" stroke="#b32d2e" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="1000" y="360" width="420" height="98" rx="10" fill="#fdf3f3" stroke="#b32d2e" stroke-width="2"/>
  <text x="1024" y="390" font-family="sans-serif" font-size="18" font-weight="700" fill="#b32d2e">Model-judged ceiling — gate 3</text>
  <text x="1024" y="416" font-family="sans-serif" font-size="15" fill="#1a1a1a">A finding a model judged may never be critical</text>
  <text x="1024" y="438" font-family="sans-serif" font-size="15" fill="#1a1a1a">unless a deterministic finding corroborates it.</text>
  <line x1="1190" y1="358" x2="1190" y2="312" stroke="#b32d2e" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- outputs -->
  <rect x="40" y="505" width="740" height="135" rx="10" fill="#f2f7fd" stroke="#1f6feb" stroke-width="2"/>
  <text x="64" y="539" font-family="sans-serif" font-size="20" font-weight="700" fill="#1f6feb">FINDING — a defect, with a fix attached</text>
  <text x="64" y="567" font-family="sans-serif" font-size="16" fill="#1a1a1a">suggested_action: steps · effort · owner · impact_rationale</text>
  <text x="64" y="591" font-family="sans-serif" font-size="16" fill="#1a1a1a">worded from the fixes library — 26 files under references/fixes/</text>
  <text x="64" y="619" font-family="sans-serif" font-size="15" fill="#5a5a5a">Shape fixed by references/finding.schema.json, so every finding carries its own evidence.</text>

  <rect x="820" y="505" width="740" height="135" rx="10" fill="#fdf8ef" stroke="#9a6700" stroke-width="2"/>
  <text x="844" y="539" font-family="sans-serif" font-size="20" font-weight="700" fill="#9a6700">PROACTIVE RECOMMENDATION — an opportunity</text>
  <text x="844" y="567" font-family="sans-serif" font-size="16" fill="#1a1a1a">A measured effect whose optimal edit is instance-dependent.</text>
  <text x="844" y="591" font-family="sans-serif" font-size="16" fill="#1a1a1a">Emitted where no defect was found. Never given a severity.</text>
  <text x="844" y="619" font-family="sans-serif" font-size="15" fill="#5a5a5a">This is the lane that stops "add a table" being reported as a bug.</text>

  <line x1="1450" y1="312" x2="1450" y2="480" stroke="#5a5a5a" stroke-width="2"/>
  <line x1="1450" y1="480" x2="410" y2="480" stroke="#5a5a5a" stroke-width="2"/>
  <line x1="410" y1="480" x2="410" y2="503" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a2)"/>
  <text x="700" y="473" font-family="sans-serif" font-size="14" fill="#5a5a5a" text-anchor="middle">a defect carries its severity forward</text>

  <!-- priority -->
  <rect x="40" y="676" width="1520" height="86" rx="10" fill="#f4f6f8" stroke="#c8c8c8"/>
  <text x="64" y="710" font-family="sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">priority_plan — ranked by impact ÷ effort, grouping the findings that share one fix</text>
  <text x="64" y="740" font-family="sans-serif" font-size="16" fill="#5a5a5a">One robots.txt edit can clear four findings, so it is ranked once, not four times. Each entry carries why_first.</text>
  <line x1="410" y1="640" x2="410" y2="674" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="1190" y1="640" x2="1190" y2="674" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a2)"/>

  <!-- worked example -->
  <rect x="40" y="800" width="1520" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="64" y="834" font-family="sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">The distinction the whole marketplace turns on — same status code, opposite meaning</text>

  <rect x="64" y="852" width="720" height="80" rx="8" fill="#fdf8ef" stroke="#9a6700"/>
  <text x="84" y="880" font-family="sans-serif" font-size="17" font-weight="700" fill="#9a6700">403 to GPTBot — a training crawler</text>
  <text x="84" y="904" font-family="sans-serif" font-size="15" fill="#1a1a1a">A licensing decision, usually taken after legal review.</text>
  <text x="84" y="924" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#9a6700">REACH-003 · low · locked · a test bans "error" "defect" "bug" "problem"</text>

  <rect x="816" y="852" width="720" height="80" rx="8" fill="#fdf3f3" stroke="#b32d2e"/>
  <text x="836" y="880" font-family="sans-serif" font-size="17" font-weight="700" fill="#b32d2e">403 to ChatGPT-User — a retrieval agent</text>
  <text x="836" y="904" font-family="sans-serif" font-size="15" fill="#1a1a1a">Fetching this page because a user just asked about you.</text>
  <text x="836" y="924" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#b32d2e">REACH-005 · high to critical · you are absent from the answer</text>
</svg>

# Candidate pool for the benchmark corpus.
#
# This file holds PRIORS ONLY. It is the input to bench/build_corpus.py, which
# crawls each site and writes bench/corpus.yaml with MEASURED labels. Where a
# measurement disagrees with the prior below, the measurement wins and the
# disagreement is recorded -- those are the most interesting entries in the
# corpus, because they are the cases human intuition gets wrong.
#
#   seo_prior   our expectation of conventional SEO health, from whether the
#               site ranks for its own category terms and is broadly cited.
#               Not measured by our tooling; confirm by hand for entries you
#               care about.
#   site_type   drives which checks apply (see site-profiles.md).
#   vertical    for spread only; not used by any check.
#
# Selection criteria: publicly reachable, no authentication, stable, varied
# verticals and architectures, and a deliberate mix of server-rendered and
# client-rendered front ends so every quadrant has a chance of being populated.
#
# Refresh with:  python bench/build_corpus.py


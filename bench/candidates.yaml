  # --- older, hand-built and minimal sites ------------------------------
  # Added to fill the poor-SEO quadrants. "Poor SEO" here means the technical
  # hygiene a conventional audit checks -- sitemap, canonicals, meta
  # descriptions, h1s, internal linking -- which hand-maintained sites from
  # before those conventions hardened routinely lack, while often having
  # excellent plain-text content. That combination is what makes them useful:
  # they separate technical SEO health from machine readability.
